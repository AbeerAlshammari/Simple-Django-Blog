{% extends 'master.html' %}

{% block title %}Blog Posts{% endblock %}

{% block content %}

<h2>All Blog Posts</h2>

{% for post in posts %}
    <h3>
        <a href="{% url 'blog_details' post.id %}">
            {{ post.title }}
        </a>
    </h3>

    <p>Category: {{ post.category.name }}</p>
    <p>Published: {{ post.date_published }}</p>

    <hr>
{% empty %}
    <p>No blog posts found.</p>
{% endfor %}

{% endblock %}
