{% extends 'master.html' %}

{% block title %}Categories{% endblock %}

{% block content %}

<h2>All Categories</h2>

<table border="1">
    <tr>
        <th>Category ID</th>
        <th>Category Name</th>
    </tr>

    {% for category in categories %}
    <tr>
        <td>{{ category.id }}</td>
        <td>{{ category.name }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="2">No categories found.</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
